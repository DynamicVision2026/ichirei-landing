# Cloud Build: build the container -> push to Artifact Registry -> deploy to
# Cloud Run service "ichirei".
#
# ANTHROPIC_API_KEY and the SHOPIFY_ADMIN client secret are NEVER baked into the image or stored in this repo. The
# deploy step mounts the Secret Manager secret named ANTHROPIC_API_KEY as an env
# var of the same name at runtime (--set-secrets below). Create/rotate the secret
# in Secret Manager (Console -> Security -> Secret Manager -> ANTHROPIC_API_KEY ->
# New version); see DEPLOY.md for the one-time IAM grant that lets Cloud Run read it.
#
# Used by a Cloud Build trigger (push to a branch) or a manual run:
#   gcloud builds submit --config cloudbuild.yaml --region asia-northeast1 .

substitutions:
  _REGION: asia-northeast1          # Tokyo
  _SERVICE: ichirei                 # Cloud Run service name
  _REPO: ichirei                    # Artifact Registry Docker repository name
  # Purchase flow (Step 4). Not secrets: the Shopify variant ids of the two packages and the
  # Cloud Storage bucket that holds the orders. Set them on the trigger (DEPLOY.md, Step 7).
  # Variant ids are identifiers, not secrets (product 一字礼 ICHIREI, option セット).
  # 2026-11-13: the owner's designer deleted the wood variants in Shopify (product title is now 「⑦ ICHIREI｜一字礼」); only the e-gift variant is left.
  # Wood is "coming soon" and is never put in a cart, so these two stay empty (a trigger that still passes the old ids is harmless).
  _SHOPIFY_VARIANT_SIMPLE: ''
  _SHOPIFY_VARIANT_STANDARD: ''
  # 一字礼 eギフト (¥3,980, SKU ICHIREI-EGIFT, a digital product with no shipping). While empty, that size is hidden on the page and refused by the server.
  _SHOPIFY_VARIANT_EGIFT: '67913881616632'
  # The Thanksgiving sale SHOWN on the site (2026-11-13): the old price struck through, the sale price and one line of words, from the first day 00:00 to the last day 23:59 (Japan time).
  # The owner's dates (2026-11-14, all markets): 30% from 2026-11-15 to 2026-11-30, matching the Shopify automatic discount 「感謝の季節 30% OFF」 (ICHIREI only). Nothing shows before _SALE_FROM or after _SALE_UNTIL;
  # empty _SALE_PERCENT = no sale at all. Our site never sets the price — Shopify's discount does; if the two disagree Shopify wins at checkout, so keep them in step.
  # The English page's price (2026-11-14, owner decision): a fixed dollar price, whole dollars, shown instead of any converted "about" figure; the sale price shows while the sale is on.
  # Checkout itself stays in yen (Shopify's variant price); these only change what /en shows. Edit them here or on the trigger.
  _USD_PRICE_EGIFT: '25'
  _USD_PRICE_EGIFT_SALE: '17.50'
  _SALE_PERCENT: '30'
  _SALE_FROM: '2026-11-15'
  _SALE_UNTIL: '2026-11-30'
  # English pages only (2026-11-14): the exact moment their sale ends (US evening of the last day included); ja / zh end with _SALE_UNTIL 23:59 JST. Empty = English follows _SALE_UNTIL.
  _SALE_UNTIL_EN: '2026-12-01T13:59+09:00'
  # The Storefront token is PUBLIC by design (it ships in every storefront). Set it on the trigger;
  # when empty the server falls back to the SHOPIFY_STOREFRONT_TOKEN secret mounted below.
  _SHOPIFY_STOREFRONT_TOKEN: ''
  # /track (order status): the read-only "ICHIREI Tracking" app. The client ID is an identifier; the
  # client SECRET is never a substitution — the server reads it from Secret Manager at request time
  # (secret SHOPIFY_ADMIN_CLIENT_SECRET), so a missing secret can never break a deploy.
  _SHOPIFY_ADMIN_CLIENT_ID: '394a8e955f7e28104f3e2089630bb3a5'
  _ORDER_BUCKET: ''                 # e.g. ichirei-orders
  # The story film's pictures (engine/film-art.ts): Google's image model on Vertex AI, through the Cloud Run service account (no key). One-time setup in DEPLOY.md
  # (enable the Vertex AI API, grant roles/aiplatform.user). Models are tried in order when one is not found; separate them with | (a comma would split this list).
  _FILM_IMAGE_MODEL: 'gemini-3.1-flash-image|gemini-2.5-flash-image'  # ICHIREI_FILM_IMAGE_MODEL
  _FILM_IMAGE_LOCATION: 'global'    # ICHIREI_FILM_IMAGE_LOCATION — a Vertex AI location where the model is served (global, or a region such as us-central1)
  _FILM_DAILY_MAX: '200'            # ICHIREI_FILM_DAILY_MAX — sets of four pictures per day (above it, the pictures wait for the next day); off = no limit
  _ANIMATION_SAMPLES: 'on'          # ICHIREI_ANIMATION_SAMPLES — off | on. TEMPORARY: four reserved sample films (/a/AN-sampleja222222222222 …) for testing the story animation on real phones; set to 'off' when done
  # Engine settings (v9 speed). Passed to the service on EVERY deploy (--update-env-vars below), so a value set earlier by hand
  # (ICHIREI_EFFORT=high …) can never silently outlive a deploy. Change them here, or per trigger, not on the console.
  _EFFORT: 'medium'                 # ICHIREI_EFFORT — selection call reasoning depth (was high)
  _MAX_TOKENS: '14000'              # ICHIREI_MAX_TOKENS — reasoning + answer, per selection call (was 20000, then 8000: too tight for long stories)
  _MAX_TOKENS_RETRY: '20000'        # ICHIREI_MAX_TOKENS_RETRY — the one automatic retry when a run still hits the limit
  _REVIEW_MODEL: 'claude-haiku-5-5' # ICHIREI_REVIEW_MODEL — the fastest current model; the review only checks a short answer
  _REVIEW_EFFORT: 'low'             # ICHIREI_REVIEW_EFFORT
  _CALL_TIMEOUT_MS: '150000'        # ICHIREI_CALL_TIMEOUT_MS — the selection call may take at most this (one automatic retry); 90 s cut off slow-but-fine runs
  _LEXICON_MODE: 'on'               # ICHIREI_LEXICON_MODE — off | shadow | on. on: main and second characters come from engine/lexicon.csv (switched on 2026-10-28
                                    # after the live shadow comparison); shadow: the palette engine answers and the lexicon's choice is only logged; off: palette engine only.
  _SIMPLE_MAX_STROKES: '20'         # ICHIREI_SIMPLE_MAX_STROKES — the Simple set carves at most this many strokes (the owner's number until the workshop gives the real limit); above it, Standard only
  _REVIEW_TIMEOUT_MS: '60000'       # ICHIREI_REVIEW_TIMEOUT_MS — the review call; if it times out the selection is shown without it
  _SUPPORT_EMAIL: ''                # ICHIREI_SUPPORT_EMAIL — the support address printed (as plain text) on the buyer's page under 「ご注文から24時間以内…」. Empty = the address is left out.
  _WOOD_SIZES: ''                   # ICHIREI_WOOD_SIZES — 'coming_soon' shows 木札 and 版木 as 「近日公開」 with disabled buttons and refuses their orders (the e-gift-first launch). Empty = on sale as usual (the default); the owner sets it
  _SELFTEST_MONTHLY_USD: '20'       # ICHIREI_SELFTEST_MONTHLY_USD — the monthly ceiling on the post-deploy self-test's ESTIMATED model spend (US dollars); above it a run answers state "budget"
  _TIMEOUT: '300'                   # Cloud Run request timeout (s). Keep in step with
                                    # the server (300s) and the frontend deadline (290s).

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  - id: push-build-tag
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID']

  - id: push-latest
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    # bash only so that the deploy time can be stamped: `__DEPLOYED_AT__` in the env-vars argument below becomes the UTC time of this step (`$$` is Cloud Build's escape for a literal `$`).
    entrypoint: bash
    args:
      - -c
      - |
        D=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
        args=("$${@/__DEPLOYED_AT__/$$D}")
        gcloud "$${args[@]}"
      - bash
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --allow-unauthenticated        # public site; see the abuse note in DEPLOY.md
      - --port=8080
      - --timeout=${_TIMEOUT}          # the whole point of the move: far above Vercel's 60s
      - --cpu=1
      - --memory=1Gi                   # the film's MP4 is composed in memory (about 0.3 GB while it runs)
      - --cpu-boost                    # faster cold starts
      - --min-instances=0
      - --max-instances=3              # caps concurrent spend; raise when needed
      # Mount the Secret Manager secrets as env vars of the same name.
      - --set-secrets=ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest,SHOPIFY_STOREFRONT_TOKEN=SHOPIFY_STOREFRONT_TOKEN:latest
      # Non-secret settings: the purchase settings and the engine speed settings. --update-env-vars leaves any other variable alone.
      - --update-env-vars=ICHIREI_EFFORT=${_EFFORT},ICHIREI_MAX_TOKENS=${_MAX_TOKENS},ICHIREI_MAX_TOKENS_RETRY=${_MAX_TOKENS_RETRY},ICHIREI_REVIEW_MODEL=${_REVIEW_MODEL},ICHIREI_REVIEW_EFFORT=${_REVIEW_EFFORT},ICHIREI_CALL_TIMEOUT_MS=${_CALL_TIMEOUT_MS},ICHIREI_REVIEW_TIMEOUT_MS=${_REVIEW_TIMEOUT_MS},ICHIREI_LEXICON_MODE=${_LEXICON_MODE},ICHIREI_SIMPLE_MAX_STROKES=${_SIMPLE_MAX_STROKES},ICHIREI_ANIMATION_SAMPLES=${_ANIMATION_SAMPLES},ICHIREI_FILM_IMAGE_MODEL=${_FILM_IMAGE_MODEL},ICHIREI_FILM_IMAGE_LOCATION=${_FILM_IMAGE_LOCATION},ICHIREI_FILM_DAILY_MAX=${_FILM_DAILY_MAX},SHOPIFY_VARIANT_SIMPLE=${_SHOPIFY_VARIANT_SIMPLE},SHOPIFY_VARIANT_STANDARD=${_SHOPIFY_VARIANT_STANDARD},SHOPIFY_VARIANT_EGIFT=${_SHOPIFY_VARIANT_EGIFT},SHOPIFY_STOREFRONT_TOKEN_PUBLIC=${_SHOPIFY_STOREFRONT_TOKEN},SHOPIFY_ADMIN_CLIENT_ID=${_SHOPIFY_ADMIN_CLIENT_ID},ORDER_BUCKET=${_ORDER_BUCKET},ICHIREI_WOOD_SIZES=${_WOOD_SIZES},ICHIREI_SUPPORT_EMAIL=${_SUPPORT_EMAIL},ICHIREI_SELFTEST_MONTHLY_USD=${_SELFTEST_MONTHLY_USD},ICHIREI_COMMIT=${SHORT_SHA},ICHIREI_DEPLOYED_AT=__DEPLOYED_AT__,SALE_PERCENT=${_SALE_PERCENT},SALE_FROM=${_SALE_FROM},SALE_UNTIL=${_SALE_UNTIL},SALE_UNTIL_EN=${_SALE_UNTIL_EN},USD_PRICE_EGIFT=${_USD_PRICE_EGIFT},USD_PRICE_EGIFT_SALE=${_USD_PRICE_EGIFT_SALE}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  # Required when the trigger runs as a user-managed service account; harmless otherwise.
  logging: CLOUD_LOGGING_ONLY
